<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:transparent;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .card{box-sizing:border-box;height:100%;margin:0;padding:12px 14px;border-radius:16px;background:#1f2024;color:#fff;border:1px solid rgba(255,255,255,.1);
    display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ico{flex:none;width:44px;height:44px;border-radius:50%;background:#fbc700;color:#2b2b2e;display:grid;place-items:center;font-weight:800;font-size:18px}
  .t{min-width:0;flex:1}
  b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  span{display:block;font-size:13px;opacity:.82;margin-top:3px;max-height:34px;overflow:hidden;line-height:1.3}
  .x{flex:none;border:0;background:none;color:#fff;opacity:.55;font-size:18px;cursor:pointer;padding:4px}
</style></head><body>
<div class="card" id="card"><div class="ico" id="ico"></div><div class="t"><b id="title"></b><span id="body"></span></div><button class="x" id="x" aria-label="close">&#10005;</button></div>
<script src="notif.js"></script>
</body></html>
