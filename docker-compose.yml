# Suhbat-dosh on a NAS (Synology Container Manager, QNAP Container Station, TrueNAS, plain Docker).
#   cp .env.example .env   # then edit .env (APP_SECRET is required)
#   docker compose up -d --build
#   docker compose --profile https up -d --build   # adds the Caddy HTTPS reverse proxy
services:
  suhbat:
    build: .
    image: suhbat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DOWNLOADS_DIR: /downloads
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data          # SQLite database + uploaded files (the only state)
      - ./backups:/backups    # output of `npm run backup`
      - ./downloads:/downloads:ro   # installers offered on /download
      - ${BACKUP_OFFSITE:-./backups-offsite}:/offsite   # a second disk for the copies (see BACKUP_MIRROR_DIR in .env.example)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Self-healing: every 30 seconds starts again any of these services that is not running (a bind mount that was not ready at boot, a crash,
  # a failed update). Docker's own restart policy does not retry a container whose start failed. Switch on with COMPOSE_PROFILES=...,watchdog.
  # To stop a service on purpose, stop the watchdog first:  docker compose stop watchdog
  watchdog:
    image: docker:cli
    profiles: ["watchdog"]
    restart: always
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PROJECT: ${COMPOSE_PROJECT_NAME:-suhbat}
      SERVICES: ${WATCHDOG_SERVICES:-suhbat tgbridge cloudflared whisper embed translate}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        while true; do
          for s in $$SERVICES; do
            for c in $$(docker ps -a -q --filter "label=com.docker.compose.project=$$PROJECT" --filter "label=com.docker.compose.service=$$s" --filter status=exited --filter status=created); do
              echo "$$(date -u +%FT%TZ) $$s was not running, starting it"
              docker start "$$c" 2>&1 | tail -1
            done
            # running but cut off from the network (a start that half failed): the others cannot find it, it cannot reach the outside
            for c in $$(docker ps -q --filter "label=com.docker.compose.project=$$PROJECT" --filter "label=com.docker.compose.service=$$s"); do
              if [ "$$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$$c")" = 0 ]; then
                echo "$$(date -u +%FT%TZ) $$s had no network, connecting it"
                docker network connect --alias "$$s" "$${PROJECT}_default" "$$c" 2>&1 | tail -1
              fi
            done
          done
          sleep 30
        done

  # Speech-to-text for voice messages (faster-whisper on the CPU). Start with:  docker compose --profile whisper up -d --build whisper
  whisper:
    build: ./whisper
    image: suhbat-whisper:latest
    profiles: ["whisper"]
    restart: unless-stopped
    mem_limit: 8g
    volumes:
      - ./whisper-models:/models    # downloaded models stay here

  # Search by meaning (embeddings of messages). Start with:  docker compose --profile embed up -d --build embed
  # (the server finds it at http://embed:9100 by itself; EMBED_URL in .env changes that)
  embed:
    build: ./embed
    image: suhbat-embed:latest
    profiles: ["embed"]
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - ./embed-models:/models

  # Bridge to your own Telegram account (see docs/tgbridge.md). BRIDGE_TOKEN goes in .env (both containers need it);
  # TGBRIDGE_KEY, TG_API_ID and TG_API_HASH go in .env.bridge so that only this container ever sees them.
  # Start with:  docker compose --profile tgbridge up -d --build tgbridge
  tgbridge:
    build: ./tgbridge
    image: suhbat-tgbridge:latest
    profiles: ["tgbridge"]
    restart: unless-stopped
    mem_limit: ${TGBRIDGE_MEM:-8g}   # about 150 MB plus 30-50 MB for every linked account; 8 GB is far more than dozens of accounts need
    env_file:
      - path: .env.bridge
        required: false
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      SERVER_URL: http://suhbat:3000
    volumes:
      - tgbridge-data:/data         # the encrypted Telegram sessions and the lists of chats (a Docker volume, owned by the container user)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # no ports are published: only the suhbat container can reach it

  # Translation of chats on your own server: Russian, Uzbek, English (Meta's NLLB-200 on the CPU; LibreTranslate has no Uzbek). Start with:
  #   docker compose --profile translate up -d --build translate
  # The first start downloads the model (about 600 MB) into ./translate-models. The server finds it at http://translate:5000 (TRANSLATE_URL in .env changes that).
  translate:
    build: ./nllb
    image: suhbat-nllb:latest
    profiles: ["translate"]
    restart: unless-stopped
    mem_limit: 3g
    environment:
      NLLB_THREADS: ${NLLB_THREADS:-4}
    volumes:
      - ./translate-models:/models
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Public access through your own Cloudflare Tunnel (profile 'tunnel'; no open ports needed).
  # Set up with: sh scripts/set-tunnel-token.sh
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [suhbat]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # Optional TURN relay for calls that cannot connect directly.
  # Needs UDP 3478 and 49160-49200 forwarded to this host (it cannot go through Cloudflare Tunnel).
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    network_mode: host
    restart: unless-stopped
    command: >
      -n --log-file=stdout --no-cli --fingerprint --lt-cred-mech
      --realm=${TURN_REALM:-suhbat-dosh.uz}
      --user=${TURN_USERNAME:-suhbat}:${TURN_CREDENTIAL:-change-me}
      --external-ip=${TURN_EXTERNAL_IP:-}
      --min-port=49160 --max-port=49200
      --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255

  # Optional HTTPS termination with automatic certificates (public domain required).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [suhbat]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tgbridge-data:
  caddy_data:
  caddy_config:
